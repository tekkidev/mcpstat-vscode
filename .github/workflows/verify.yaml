name: VS Code extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install build dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Test statistics, history and input handling
        run: npm test
      - name: Verify read-only SQLite access
        run: python -m unittest discover -s test -p 'test_*.py' -v
      - name: Install the server for integration checks
        run: python -m pip install "mcpstat[server]>=0.3.0,<0.4"
      - name: Verify the installed distribution outside the checkout
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/test/verify_mcp.py" "$RUNNER_TEMP/stdio-verification"
      - name: Verify HTTP MCP statistics
        run: npm run test:mcp
      - name: Test the dashboard in Chrome
        run: npm run test:ui
      - name: Check runtime and build dependencies
        run: npm audit --include=dev
      - name: Build VSIX
        run: npm run package -- --out "$RUNNER_TEMP/mcpstat-dashboard.vsix"
      - name: Upload tested VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcpstat-dashboard-vsix
          path: ${{ runner.temp }}/mcpstat-dashboard.vsix
          if-no-files-found: error
          retention-days: 7
